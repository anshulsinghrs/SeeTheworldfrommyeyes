<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATLAS — your personal world</title>
<meta name="description" content="ATLAS is a customizable personal environment for everything you learn, experience, create and discover — a personal knowledge graph you experience as a calm, beautiful space.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/atlas.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
</head>
<body>
<div id="app">
  <header class="brand"><span class="dot"></span><b>ATLAS</b></header>
  <div class="top">
    <button class="iconbtn menu-btn" data-menu aria-label="Menu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <div class="searchwrap">
      <div class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8A8A85" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="gsearch" placeholder="Search your ATLAS — books, people, places, ideas…  ( / )" autocomplete="off">
      </div>
      <div id="results"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" data-go="#/ask"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2.5a5.5 5.5 0 0 0-4.6 8.5L2.6 13.4l2.6-.8A5.5 5.5 0 1 0 8 2.5Z"/></svg> Ask</button>
    <button class="btn-accent btn" data-add><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.7"><path d="M6 1v10M1 6h10"/></svg> Add</button>
  </div>
  <nav class="nav"></nav>
  <main class="main"></main>
</div>

<div id="scrim"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="assets/store.js"></script>
<script src="assets/ai.js"></script>
<script src="assets/views.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
