<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS — Your knowledge, connected to the world.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#08080A; --bg2:#0C0C0F;
  --panel:rgba(16,16,19,.86); --panel-solid:#101013;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
  --ink:#F3F2EF; --ink2:#C9C8C3; --mute:#7E7E79; --mute2:#5A5A56;
  --accent:#FF7A33; --red:#E5484D;
  --land:#161719; --land-line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:#ffa06b}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

#map{position:fixed;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, #0C0D11 0%, #08080A 60%, #06060700 100%);}
#map svg{display:block;cursor:grab;touch-action:none}
#map svg.dragging{cursor:grabbing}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.6px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:rgba(255,255,255,.035);stroke-width:.5px;vector-effect:non-scaling-stroke}
.sphere{fill:none;stroke:rgba(255,255,255,.10);stroke-width:.8px;vector-effect:non-scaling-stroke}
.clabel{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.18em;fill:rgba(255,255,255,.30);text-transform:uppercase;pointer-events:none}
.plabel{font-family:"IBM Plex Sans",sans-serif;font-size:10px;fill:rgba(255,255,255,.55);pointer-events:none;letter-spacing:.02em}
.node{cursor:pointer}
.node .halo{opacity:0;transition:opacity .18s}
.node:hover .halo,.node.sel .halo{opacity:1}
.cluster{cursor:pointer}

/* ---------- chrome ---------- */
.top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:16px;padding:0 16px;z-index:40;
  background:linear-gradient(180deg,rgba(8,8,10,.92),rgba(8,8,10,.55) 70%,rgba(8,8,10,0));backdrop-filter:blur(6px)}
.wm{display:flex;align-items:baseline;gap:9px;flex:none}
.wm b{font-weight:600;font-size:15px;letter-spacing:.34em;margin-right:-.34em}
.wm span{font-size:10px;color:var(--mute2);letter-spacing:.04em}
.searchwrap{position:relative;flex:1;min-width:0;max-width:520px;margin:0 auto}
.search{display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:3px;
  background:rgba(255,255,255,.035);transition:border-color .18s,background .18s}
.search:focus-within{border-color:rgba(255,122,51,.55);background:rgba(255,255,255,.055)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font-size:13px}
.search input::placeholder{color:var(--mute2)}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--mute2);border:1px solid var(--line);border-radius:2px;padding:2px 4px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:3px;
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;color:var(--ink2);
  background:rgba(255,255,255,.03);transition:.16s}
.btn:hover{background:rgba(255,255,255,.07);color:var(--ink);border-color:rgba(255,255,255,.18)}
.btn.on{background:rgba(255,122,51,.12);border-color:rgba(255,122,51,.5);color:#FFB184}
.btn-add{background:var(--accent);border-color:var(--accent);color:#120800;font-weight:500}
.btn-add:hover{background:#ff8c4d;border-color:#ff8c4d;color:#120800}
.btn.sm{height:28px;padding:0 10px;font-size:10px}

.bottom{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(0deg,rgba(8,8,10,.94),rgba(8,8,10,.5) 70%,rgba(8,8,10,0));backdrop-filter:blur(6px)}
.tl{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.tlbar{position:relative;flex:1;height:26px;min-width:120px}
.tlaxis{position:absolute;top:13px;left:0;right:0;height:1px;background:var(--line)}
.tltick{position:absolute;top:8px;width:1px;height:6px;background:rgba(255,255,255,.16)}
.tlyr{position:absolute;top:18px;transform:translateX(-50%);font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--mute2)}
.tlfill{position:absolute;top:13px;left:0;height:1px;background:linear-gradient(90deg,rgba(255,122,51,.15),var(--accent))}
.tlhandle{position:absolute;top:6px;width:2px;height:15px;background:var(--accent);box-shadow:0 0 10px rgba(255,122,51,.7)}
.tlhandle:after{content:"";position:absolute;left:-7px;top:-4px;width:16px;height:23px;cursor:ew-resize}
.tlval{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);width:34px;flex:none}

/* ---------- floating panels ---------- */
.pnl{position:fixed;z-index:45;background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);
  border-radius:4px;box-shadow:0 22px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.4)}
.pnl-h{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line2)}
.x{width:22px;height:22px;display:grid;place-items:center;color:var(--mute);border-radius:2px}
.x:hover{background:rgba(255,255,255,.08);color:var(--ink)}

#layers{left:16px;bottom:68px;width:238px;display:none}
.lay{display:flex;align-items:center;gap:10px;padding:7px 13px;cursor:pointer}
.lay:hover{background:rgba(255,255,255,.04)}
.box{width:12px;height:12px;border:1px solid rgba(255,255,255,.28);border-radius:2px;flex:none;display:grid;place-items:center}
.lay.on .box{background:var(--accent);border-color:var(--accent)}
.lay.on .box svg{display:block}
.box svg{display:none;width:8px;height:8px;stroke:#120800;stroke-width:3}
.lay .nm{flex:1;font-size:12px;color:var(--ink2)}
.lay.on .nm{color:var(--ink)}
.lay .ct{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mute2)}

#stats{right:16px;bottom:68px;width:252px;display:none}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:6px 13px}
.stat b{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px}
.bigstat{padding:14px 13px 10px}
.bigstat em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:400;letter-spacing:-.02em}

#detail{top:66px;right:16px;bottom:68px;width:374px;display:none;flex-direction:column;overflow:hidden}
#detail.open{display:flex}
.dbody{overflow-y:auto;padding:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);border-radius:2px;color:var(--ink2)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
.h1{font-size:20px;font-weight:400;line-height:1.24;letter-spacing:-.01em;margin:11px 0 5px;text-wrap:pretty}
.sub{font-size:12.5px;color:var(--mute);line-height:1.5}
.loc{display:grid;grid-template-columns:8px 1fr;gap:11px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.loc:first-of-type{border-top:0}
.loc:hover .locn{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:4px}
.locn{font-size:13px;transition:color .15s}
.locmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 5px;border-radius:2px;
  border:1px solid var(--line);color:var(--mute)}
.tag.ok{border-color:rgba(69,192,139,.4);color:#6DD3A7}
.tag.ai{border-color:rgba(255,122,51,.4);color:#FFA06B}
.conf{position:relative;width:46px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.conf i{position:absolute;inset:0;right:auto;background:var(--ink2)}
.note{font-size:12.5px;line-height:1.6;color:var(--ink2);border-left:1px solid rgba(255,122,51,.5);padding-left:11px}
.graph{width:100%;height:190px}
.graph text{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.tagpill{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 9px}

#results{position:absolute;top:40px;left:0;right:0;max-height:min(58vh,420px);overflow-y:auto;display:none}
.res{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line2)}
.res:hover{background:rgba(255,255,255,.05)}
.res .t{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .s{font-size:10.5px;color:var(--mute);margin-top:2px}
.reshd{padding:8px 12px 4px}

/* ---------- add modal ---------- */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(4,4,5,.72);backdrop-filter:blur(3px);display:none}
#scrim.open{display:block}
#add{position:fixed;z-index:61;top:13vh;left:50%;transform:translateX(-50%);width:min(680px,92vw);display:none;
  background:rgba(14,14,17,.97);border:1px solid rgba(255,255,255,.12);border-radius:5px;
  box-shadow:0 40px 110px -30px #000,0 0 0 1px rgba(0,0,0,.6);overflow:hidden}
#add.open{display:block;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.addhd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line2)}
.bigin{width:100%;background:none;border:0;outline:0;color:var(--ink);font-size:19px;font-weight:300;padding:22px 18px 6px}
.bigin::placeholder{color:var(--mute2)}
.srcs{display:flex;gap:7px;padding:8px 18px 16px;flex-wrap:wrap}
.sugs{border-top:1px solid var(--line2);padding:10px 0 12px}
.sug{display:grid;grid-template-columns:18px 1fr auto;gap:11px;align-items:center;padding:8px 18px;cursor:pointer}
.sug:hover{background:rgba(255,255,255,.05)}
.sug .t{font-size:12.5px}
.sug .s{font-size:10.5px;color:var(--mute)}
.step{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:12px;color:var(--mute2)}
.step.doing{color:var(--ink)}
.step.done{color:var(--ink2)}
.spin{width:11px;height:11px;border:1.5px solid rgba(255,122,51,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pick{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer;align-items:start}
.pick:hover{background:rgba(255,255,255,.035)}
.pick.on{background:rgba(255,122,51,.055)}
.addft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.fld{display:block;margin-bottom:12px}
.fld .lbl{display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:3px;
  color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:rgba(255,122,51,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:70;display:none;align-items:center;gap:10px;
  background:rgba(16,16,19,.96);border:1px solid rgba(255,122,51,.4);border-radius:3px;padding:10px 14px;font-size:12px;
  box-shadow:0 20px 50px -20px #000}
.toast.on{display:flex;animation:pop .2s}
.hint{position:fixed;left:16px;top:66px;z-index:30;max-width:250px;font-size:11px;line-height:1.55;color:var(--mute2)}
.hint b{display:block;color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;margin-bottom:4px}
@media (max-width:820px){.searchwrap{max-width:none}.wm span{display:none}#detail{left:16px;width:auto}.hint{display:none}}
/* ---------- phones ---------- */
@media (max-width:600px){
  .top{height:52px;gap:9px;padding:0 10px}
  .wm b{font-size:13px;letter-spacing:.22em;margin-right:-.22em}
  .search{height:34px;padding:0 10px}
  .search input{font-size:15px} /* >=16px-ish avoids iOS zoom-on-focus without being large */
  .search .kbd{display:none}
  .btn-add{padding:0 11px}
  .bottom{height:54px;gap:8px;padding:0 10px}
  .tl{gap:8px}
  .tl > .lbl{display:none}
  #playBtn{display:none}
  .tlbar{min-width:64px}
  .tlval{width:30px;font-size:12px}
  .tl-mid{display:none} /* thin out crowded year labels on phones */
  .btn{height:36px;padding:0 11px} /* comfortable tap targets */
  /* floating panels become full-width bottom sheets */
  #layers,#stats{left:8px;right:8px;width:auto;bottom:62px}
  #detail{top:60px;left:8px;right:8px;bottom:62px;width:auto}
  .sec{padding:14px 15px}
  #results{max-height:min(64vh,480px)}
}
@media (max-width:600px) and (display-mode:standalone){
  .top{padding-top:env(safe-area-inset-top)}
}
/* respect users who prefer reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="hint"><b>Mock data</b>28 seeded objects across 6 continents. Every location carries a relationship type, a resolution and a confidence — never a bare pin.</div>

<header class="top">
  <div class="wm"><b>ATLAS</b><span>Your knowledge, connected to the world.</span></div>
  <div class="searchwrap">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#7E7E79" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" placeholder="Search objects, places, relationships — or ask &ldquo;books about Japan&rdquo;" autocomplete="off">
      <span class="kbd">/</span>
    </div>
    <div class="pnl" id="results"></div>
  </div>
  <button class="btn btn-add" id="openAdd">
    <svg width="11" height="11" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6"><path d="M6 1v10M1 6h10"/></svg>Add</button>
</header>

<div class="bottom">
  <button class="btn" id="layBtn">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 1.6 14.4 5 8 8.4 1.6 5 8 1.6Z"/><path d="M2.4 8.6 8 11.6l5.6-3M2.4 11.6 8 14.6l5.6-3"/></svg>Layers</button>
  <div class="tl">
    <span class="lbl" style="flex:none">Timeline</span>
    <div class="tlbar" id="tlbar">
      <div class="tlaxis"></div><div class="tlfill" id="tlfill"></div><div class="tlhandle" id="tlhandle"></div>
    </div>
    <span class="tlval" id="tlval">2026</span>
    <button class="btn sm" id="playBtn">Play</button>
  </div>
  <button class="btn" id="statBtn">My Atlas</button>
</div>

<div class="pnl" id="layers">
  <div class="pnl-h"><span class="lbl">Layers</span><button class="x" id="layX">✕</button></div>
  <div id="layList" style="padding:5px 0"></div>
  <div style="padding:9px 13px;border-top:1px solid var(--line2);display:flex;gap:8px">
    <button class="btn sm" id="layAll" style="flex:1">All</button><button class="btn sm" id="layNone" style="flex:1">None</button>
  </div>
</div>

<div class="pnl" id="stats">
  <div class="pnl-h"><span class="lbl">My Atlas</span><button class="x" id="statX">✕</button></div>
  <div class="bigstat"><em id="sObj">0</em> <span class="lbl">objects</span></div>
  <div id="sBreak" style="padding:0 0 8px"></div>
  <div style="border-top:1px solid var(--line2);padding:8px 0">
    <div class="stat"><span class="sub">Locations</span><b id="sLoc">0</b></div>
    <div class="stat"><span class="sub">Countries</span><b id="sCty">0</b></div>
    <div class="stat"><span class="sub">Relationships</span><b id="sRel">0</b></div>
  </div>
</div>

<div class="pnl" id="detail"></div>

<div id="scrim"></div>
<div id="add"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== TYPES & RELATIONSHIPS ============================== */
const GLYPH = {
  NEWS:'<rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M5 6h4M5 8.5h6M5 11h3"/>',
  BOOK:'<path d="M3 3.5h7a1.5 1.5 0 0 1 1.5 1.5v7.5H4.5A1.5 1.5 0 0 1 3 11z"/><path d="M13 3.5v9"/>',
  PAPER:'<path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3M6 8.5h4M6 11h3"/>',
  PERSON:'<circle cx="8" cy="6" r="2.4"/><path d="M3.8 13.2a4.4 4.4 0 0 1 8.4 0"/>',
  MOVIE:'<rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M5.5 3.5v9M10.5 3.5v9M2.5 8h11"/>',
  MUSIC:'<circle cx="5" cy="11.5" r="2"/><path d="M7 11.5V3.5l5.5-1v3"/>',
  COMPANY:'<rect x="3" y="4" width="10" height="9"/><path d="M5.5 6.5h2M8.5 6.5h2M5.5 9.5h2M8.5 9.5h2"/>',
  PLACE:'<path d="M8 13.5S3.5 9.8 3.5 6.8a4.5 4.5 0 0 1 9 0C12.5 9.8 8 13.5 8 13.5Z"/><circle cx="8" cy="6.8" r="1.5"/>',
  HISTORY:'<circle cx="8" cy="8" r="5.2"/><path d="M8 5v3.3l2.2 1.4"/>',
  NOTE:'<rect x="3" y="2.8" width="10" height="10.4" rx="1"/><path d="M5.6 6h4.8M5.6 8.4h4.8M5.6 10.8h3"/>',
  PHOTO:'<rect x="2.5" y="3.5" width="11" height="9" rx="1"/><circle cx="6" cy="6.8" r="1.2"/><path d="M3 11.5 6.6 8.4l3 2.4 2-1.6 1.4 1.2"/>',
  WEB:'<circle cx="8" cy="8" r="5.2"/><path d="M2.8 8h10.4M8 2.8c2.6 2.8 2.6 7.6 0 10.4M8 2.8c-2.6 2.8-2.6 7.6 0 10.4"/>'
};
const REL = {
  HAPPENED_AT:'#E5484D', MENTIONED_IN:'#6E6E68', STUDY_AREA:'#45C08B', AUTHOR_INSTITUTION:'#4C93E8',
  PUBLISHED_IN:'#E3B341', CONFERENCE_AT:'#B07CE8', BORN_IN:'#FF7A33', SET_IN:'#B07CE8', LIVED_IN:'#E8679B',
  WORKED_IN:'#4C93E8', FILMED_IN:'#E8679B', VISITED:'#2FC8C8', PHOTOGRAPHED_AT:'#2FC8C8', ABOUT:'#8A8A85',
  HEADQUARTERED_IN:'#7C8BE8', FOUNDED_IN:'#C7A44A', DIED_IN:'#8A5A5A', LOCATED_AT:'#7C8BE8', USER_ADDED:'#FF7A33'
};
const relColor = r => REL[r] || '#8A8A85';
const LAYERS = [
  ['NEWS','News'],['BOOK','Books'],['PAPER','Research'],['PERSON','People'],['PLACE','Places'],
  ['HISTORY','History'],['MOVIE','Movies'],['MUSIC','Music'],['COMPANY','Companies'],['NOTE','Notes'],['PHOTO','Photographs']
];

/* ============================== MOCK DATA (clearly seeded, non-real) ============================== */
let OBJECTS = [

/* ============================== MAP ============================== */
const wrap=document.getElementById('map');
let W=wrap.clientWidth,H=wrap.clientHeight;
const svg=d3.select(wrap).append('svg').attr('width',W).attr('height',H);
const gGeo=svg.append('g'), gLab=svg.append('g'), gNode=svg.append('g');
const projection=d3.geoNaturalEarth1(), path=d3.geoPath(projection);
let land=null, countries=[], t=d3.zoomIdentity;

function fit(){
  W=wrap.clientWidth;H=wrap.clientHeight;
  svg.attr('width',W).attr('height',H);
  projection.fitExtent([[24,64],[W-24,H-58]],{type:'Sphere'});
}
const zoom=d3.zoom().scaleExtent([1,36]).on('zoom',e=>{t=e.transform;draw();})
  .on('start',()=>svg.classed('dragging',1)).on('end',()=>svg.classed('dragging',0));
svg.call(zoom).on('dblclick.zoom',null);

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo=>{
  land=topojson.feature(topo,topo.objects.countries);
  countries=land.features;
  fit();draw();
}).catch(()=>{
  // Basemap CDN unreachable (offline / blocked). The app still works —
  // objects render on the graticule sphere — so degrade gracefully and say so.
  fit();draw();
  const n=document.createElement('div');
  n.className='hint';n.style.cssText='top:auto;bottom:64px;left:16px;color:#E5A06B;z-index:46';
  n.innerHTML='<b>Basemap offline</b>Country outlines could not be loaded. Your objects still plot by coordinate — reconnect to restore the map.';
  document.body.appendChild(n);
});

const P=(lng,lat)=>projection([lng,lat]);
function nodes(){
  const out=[];
  OBJECTS.forEach(o=>{
    if(!st.on.has(o.type))return;
    if(o.year>st.year)return;
    if(st.q && !match(o,st.q))return;
    o.links.forEach((l,i)=>{const p=P(l.lng,l.lat); if(p) out.push({o,l,i,px:p[0],py:p[1],key:o.id+'-'+i});});
  });
  return out;
}
function match(o,q){
  q=q.toLowerCase();
  const hay=[o.title,o.sub,o.desc,o.type,(o.tags||[]).join(' '),o.links.map(l=>l.loc+' '+l.ctry+' '+l.rel).join(' ')].join(' ').toLowerCase();
  return q.split(/\s+/).filter(w=>w.length>1&&!['show','me','my','all','about','in','the','everything','saved','related','to'].includes(w)).every(w=>hay.includes(w))
    || hay.includes(q);
}
function cluster(ns){
  const R=34/1, out=[], grid=new Map();
  ns.forEach(n=>{
    const x=t.applyX(n.px),y=t.applyY(n.py);
    const k=Math.round(x/R)+':'+Math.round(y/R);
    if(!grid.has(k))grid.set(k,[]);
    grid.get(k).push(Object.assign({x,y},n));
  });
  grid.forEach(g=>{
    if(g.length===1||t.k>14){g.forEach(n=>out.push({one:n,x:n.x,y:n.y}));}
    else out.push({many:g,x:d3.mean(g,d=>d.x),y:d3.mean(g,d=>d.y)});
  });
  return out;
}

function draw(){
  gGeo.attr('transform',t);
  if(land){
    if(gGeo.select('.sphere').empty()){
      gGeo.append('path').attr('class','sphere').datum({type:'Sphere'});
      gGeo.append('path').attr('class','grat').datum(d3.geoGraticule10());
      gGeo.append('path').attr('class','land');
    }
    gGeo.select('.sphere').attr('d',path);
    gGeo.select('.grat').attr('d',path);
    gGeo.select('.land').attr('d',path(land));
  }
  // labels (screen space, constant size)
  const showC=t.k>1.15, showP=t.k>2.2;
  const cl = showC? countries.filter(f=>{
      const c=path.centroid(f); if(isNaN(c[0]))return false;
      const x=t.applyX(c[0]),y=t.applyY(c[1]);
      f.__x=x;f.__y=y; return x>30&&x<W-30&&y>62&&y<H-62 && d3.geoArea(f)>(t.k>4?0.00025:0.0022);
    }).slice(0,46):[];
  const lj=gLab.selectAll('text.clabel').data(cl,f=>f.id);
  lj.exit().remove();
  lj.enter().append('text').attr('class','clabel').attr('text-anchor','middle').text(f=>(f.properties.name||'').slice(0,26))
    .merge(lj).attr('x',f=>f.__x).attr('y',f=>f.__y);

  const ns=nodes(), cs=cluster(ns);
  const pl = showP? ns.filter(n=>{const x=t.applyX(n.px),y=t.applyY(n.py);n.__x=x;n.__y=y;return x>0&&x<W&&y>60&&y<H-60}).slice(0,40):[];
  const pj=gLab.selectAll('text.plabel').data(pl,n=>n.key);
  pj.exit().remove();
  pj.enter().append('text').attr('class','plabel').attr('x',n=>n.__x+15).attr('y',n=>n.__y+4).text(n=>n.l.loc)
    .merge(pj).attr('x',n=>n.__x+15).attr('y',n=>n.__y+4);

  const j=gNode.selectAll('g.mk').data(cs,d=>d.one?d.one.key:'c'+Math.round(d.x)+'_'+Math.round(d.y)+'_'+d.many.length);
  j.exit().remove();
  const en=j.enter().append('g').attr('class','mk');
  en.each(function(d){
    const g=d3.select(this);
    if(d.one){
      const c=relColor(d.one.l.rel), dim=d.one.l.conf<.7;
      g.attr('class','mk node').on('click',ev=>{ev.stopPropagation();openDetail(d.one.o.id,d.one.i);})
       .on('mouseenter',()=>g.raise());
      g.append('circle').attr('class','halo').attr('r',17).attr('fill','none').attr('stroke',c).attr('stroke-opacity',.35).attr('stroke-width',1);
      g.append('circle').attr('r',11).attr('fill','#0C0C0F').attr('stroke',c).attr('stroke-width',dim?1:1.4).attr('stroke-dasharray',dim?'2 2':null);
      g.append('g').attr('transform','translate(-8,-8)').html('<g fill="none" stroke="'+c+'" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity="'+(dim?.7:1)+'">'+(GLYPH[d.one.o.type]||GLYPH.NOTE)+'</g>');
      g.append('title').text(d.one.o.title+' — '+d.one.l.loc+' ('+d.one.l.rel+')');
    } else {
      const n=d.many.length, r=Math.min(24,11+Math.sqrt(n)*2.6);
      g.attr('class','mk cluster').on('click',ev=>{ev.stopPropagation();
        svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(Math.min(36,t.k*2.4)).translate(-d3.mean(d.many,m=>m.px),-d3.mean(d.many,m=>m.py)));});
      g.append('circle').attr('r',r+6).attr('fill','rgba(255,122,51,.06)');
      g.append('circle').attr('r',r).attr('fill','rgba(12,12,15,.92)').attr('stroke','rgba(255,255,255,.3)').attr('stroke-width',1);
      const cols=[...new Set(d.many.map(m=>relColor(m.l.rel)))].slice(0,6);
      cols.forEach((c,i)=>{const a0=i/cols.length*2*Math.PI-Math.PI/2,a1=(i+1)/cols.length*2*Math.PI-Math.PI/2;
        g.append('path').attr('d',d3.arc()({innerRadius:r+1.5,outerRadius:r+3,startAngle:a0+.06,endAngle:a1-.06})).attr('fill',c).attr('opacity',.85);});
      g.append('text').attr('text-anchor','middle').attr('dy',4).attr('class','mono').attr('fill','#F3F2EF').attr('font-size',n>99?10:12).text(n);
      g.append('title').text(n+' objects — click to zoom in');
    }
  });
  gNode.selectAll('g.mk').attr('transform',d=>'translate('+d.x+','+d.y+')')
    .classed('sel',d=>d.one&&st.sel&&d.one.o.id===st.sel.id);
  gNode.selectAll('g.mk').filter(d=>d.one&&st.sel&&d.one.o.id===st.sel.id).raise();
}
svg.on('click',()=>closeDetail());
window.addEventListener('resize',()=>{fit();draw();});

const layList=document.getElementById('layList');
function renderLayers(){
  layList.innerHTML=LAYERS.map(([k,n])=>{
    const ct=OBJECTS.filter(o=>o.type===k).length;
    return '<div class="lay '+(st.on.has(k)?'on':'')+'" data-k="'+k+'">'+
      '<span class="box"><svg viewBox="0 0 10 10" fill="none"><path d="M1.5 5 4 7.5 8.5 2.5"/></svg></span>'+
      '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="'+(st.on.has(k)?'#C9C8C3':'#5A5A56')+'" stroke-width="1.1">'+(GLYPH[k]||'')+'</svg>'+
      '<span class="nm">'+n+'</span><span class="ct">'+ct+'</span></div>';
  }).join('');
  layList.querySelectorAll('.lay').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k; st.on.has(k)?st.on.delete(k):st.on.add(k); renderLayers();draw();});
}
renderLayers();

function renderResults(){
  const q=st.q;
  if(!q){resEl.style.display='none';return}
  const hits=OBJECTS.filter(o=>match(o,q)).slice(0,14);
  resEl.style.display='block';
  if(!hits.length){resEl.innerHTML='<div class="reshd"><span class="lbl">No matches</span><div class="sub" style="padding:6px 0 4px">Nothing in your atlas matches “'+esc(q)+'”. Try a place, a relationship (SET_IN), or a tag.</div></div>';return}
  const byType={};hits.forEach(o=>(byType[o.type]=byType[o.type]||[]).push(o));
  resEl.innerHTML=Object.entries(byType).map(([ty,os])=>
    '<div class="reshd"><span class="lbl">'+((LAYERS.find(l=>l[0]===ty)||[,ty])[1])+' · '+os.length+'</span></div>'+
    os.map(o=>'<div class="res" data-id="'+o.id+'">'+
      '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="'+relColor(o.links[0].rel)+'" stroke-width="1.15">'+(GLYPH[o.type]||'')+'</svg>'+

      '<span class="tag">'+o.year+'</span></div>').join('')).join('');
  resEl.querySelectorAll('.res').forEach(el=>el.onclick=()=>{openDetail(el.dataset.id,0);resEl.style.display='none'});
}

    s+='<text x="'+(ox+62)+'" y="'+(y-6)+'" fill="'+c+'" fill-opacity=".9">'+l.rel+'</text>';

}

  addEl.querySelectorAll('select[data-rel]').forEach(s=>s.onchange=()=>{g.links[+s.dataset.rel].rel=s.value;renderConfirm()});
  addEl.querySelector('#back').onclick=()=>{ADD.step='input';renderAdd()};
  addEl.querySelector('#toManual').onclick=()=>{ADD.manual.title=g.title;ADD.manual.type=g.type;ADD.step='manual';renderAdd()};
  addEl.querySelector('#save').onclick=()=>{
    if(!ADD.chosen.size){toast('Pick at least one location — or add one manually.');return}
    const t2=addEl.querySelector('#gt').value.trim()||g.title;
    commit({id:'n'+Date.now(),type:g.type,title:t2,sub:addEl.querySelector('#gs').value,year:g.year||2026,desc:g.desc,tags:['#added'],
      links:[...ADD.chosen].sort().map(i=>Object.assign({},g.links[i],{st:'CONFIRMED'}))});
  };
}
function renderManual(){
  const m=ADD.manual;
  addEl.innerHTML=HD('Manual entry — no AI involved')+
  '<div style="padding:18px 18px 4px">'+
    '<label class="fld"><span class="lbl">Title</span><input id="mt" value="'+esc(m.title)+'" placeholder="What is it?"></label>'+
    '<div class="grid2"><label class="fld"><span class="lbl">Type</span><select id="mty">'+LAYERS.map(([k,n])=>'<option value="'+k+'" '+(k===m.type?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+
    '<label class="fld"><span class="lbl">Relationship</span><select id="mrel">'+Object.keys(REL).map(r=>'<option '+(r===m.rel?'selected':'')+'>'+r+'</option>').join('')+'</select></label></div>'+
    '<label class="fld"><span class="lbl">Location</span><input id="mloc" placeholder="Search a place — Kolkata, Kyoto, Lagos…" value="'+esc(m.loc?m.loc[0]:'')+'" autocomplete="off"></label>'+
    '<div id="mhits" style="margin:-6px 0 12px;max-height:132px;overflow-y:auto"></div>'+
    '<label class="fld"><span class="lbl">Private note</span><textarea id="mnote" rows="2" placeholder="Why does this matter to you?">'+esc(m.note)+'</textarea></label>'+
  '</div>'+
  '<div class="addft"><button class="btn sm" id="back">Back</button><button class="btn btn-add" id="msave">Add to map</button></div>';
  wire();
  addEl.querySelector('#back').onclick=()=>{ADD.step=ADD.guess?'confirm':'input';renderAdd()};
  const mi=addEl.querySelector('#mloc'),hits=addEl.querySelector('#mhits');
  const search=()=>{
    const q=mi.value.trim().toLowerCase();
    if(!q){hits.innerHTML='';return}
    const r=CITIES.filter(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q)).slice(0,6);
    hits.innerHTML=r.length?r.map(c=>'<div class="res" style="grid-template-columns:1fr auto;border:0" data-c="'+esc(c.join('|'))+'">'+
      '<div><div class="t">'+c[0]+'</div><div class="s">'+c[1]+' · CITY</div></div><span class="tag">'+c[2].toFixed(2)+', '+c[3].toFixed(2)+'</span></div>').join('')
      :'<div class="sub" style="padding:6px 2px;font-size:11.5px">No match in the gazetteer. Location could not be determined — drop a point on the map instead.</div>';
    hits.querySelectorAll('.res').forEach(el=>el.onclick=()=>{const c=el.dataset.c.split('|');
      m.loc=[c[0],c[1],+c[2],+c[3]];mi.value=c[0];hits.innerHTML='<div class="sub" style="padding:6px 2px;font-size:11.5px;color:#6DD3A7">'+c[0]+' selected · CITY · confirmed by you</div>';});
  };
  mi.oninput=search;
  addEl.querySelector('#msave').onclick=()=>{
    const title=addEl.querySelector('#mt').value.trim();
    if(!title){toast('Give it a title.');return}
    if(!m.loc){toast('Pick a location from the list — I will not guess coordinates.');return}
    commit({id:'n'+Date.now(),type:addEl.querySelector('#mty').value,title,sub:'Added manually',year:2026,
      desc:'',note:addEl.querySelector('#mnote').value||'',tags:['#added'],
      links:[{loc:m.loc[0],ctry:m.loc[1],lat:m.loc[2],lng:m.loc[3],rel:addEl.querySelector('#mrel').value,conf:1,res:'CITY',st:'CONFIRMED'}]});
  };
}
function commit(obj){
  OBJECTS.push(obj);st.on.add(obj.type);
  if(obj.year>st.year)setYear(obj.year);
  renderLayers();renderStats();closeAdd();draw();
  toast('“'+obj.title+'” added · '+obj.links.length+' relationship'+(obj.links.length>1?'s':''));
  setTimeout(()=>openDetail(obj.id,0),380);
}
let tT;
function toast(msg){const el=document.getElementById('toast');
  el.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#FF7A33" stroke-width="1.6"><path d="M2 6.2 4.6 8.8 10 3.4"/></svg><span>'+esc(msg)+'</span>';
  el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),3400);}
</script>
</body>
</html>
